[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trl_jobs"
description = "TRL Jobs."
authors = [
    { name="Quentin Gallouédec", email="quentin.gallouedec@huggingface.co" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.34.4",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.optional-dependencies]
sagemaker = [
    "sagemaker>=3.1.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]
all = [
    "trl_jobs[sagemaker]",
]

[project.urls]
homepage = "https://github.com/huggingface/trl-jobs"
repository = "https://github.com/huggingface/trl-jobs"

[project.scripts]
trl-jobs = "trl_jobs.cli:main"
trl-sagemaker = "trl_sagemaker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trl_jobs", "trl_sagemaker"]
include = [
  "trl_jobs/configs/*.yaml",
  "trl_sagemaker/configs/models/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
  "trl_jobs",
  "trl_sagemaker",
  "README.md",
  "pyproject.toml",
]

[tool.hatch.version]
path = "trl_jobs/version.txt"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

